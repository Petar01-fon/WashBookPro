# Production stack: Caddy (HTTPS) -> web / backend. Postgres and the backend
# are reachable only on the internal network; no pgAdmin in production.
# Usage (from infra/): docker compose -f docker-compose.prod.yml --env-file .env.prod <command>
name: washbook-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off: docker compose ... run --rm migrate
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrate
    profiles: ["tools"]
    environment:
      ConnectionStrings__Default: ${CONNECTION_STRING}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Resend__ApiKey: ${RESEND_API_KEY}
      Resend__FromEmail: ${RESEND_FROM_EMAIL}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Frontend__BaseUrl: https://${WEB_DOMAIN}
      Cors__AllowedOrigins__0: https://${WEB_DOMAIN}
      Sentry__Dsn: ${SENTRY_DSN_BACKEND:-}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8080
    networks:
      - internal
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - web
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
